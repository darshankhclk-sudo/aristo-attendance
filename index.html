<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARISTO ATTENDANCE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #f5f6f8;
      font-family: Arial, Helvetica, sans-serif; color: #202124;
    }
    .app { width: 100%; max-width: 420px; min-height: 100vh; margin: auto; padding: 20px; }
    .logo { text-align: center; font-size: 24px; font-weight: bold; color: #1a73e8; margin: 20px 0 25px; }
    .card { background: white; border-radius: 14px; padding: 22px; box-shadow: 0 3px 15px rgba(0,0,0,0.08); }
    .view { display: none; }
    .view.active { display: block; }
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    input { width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #1a73e8; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:disabled { opacity: 0.6; }
    .blue { background: #1a73e8; }
    .green { background: #34a853; }
    .red { background: #ea4335; }
    .gray { background: #5f6368; }
    .error { color: #d93025; text-align: center; font-size: 14px; margin-top: 12px; }
    .status { text-align: center; font-size: 18px; font-weight: bold; margin: 20px 0; }
    .subtext { text-align: center; color: #666; font-size: 14px; }
    #photo-preview { width: 100%; max-height: 400px; object-fit: contain; border-radius: 10px; background: #eee; margin-bottom: 15px; }
    .photo-buttons { display: flex; gap: 10px; }
    .photo-buttons button { flex: 1; }
    .loader { width: 40px; height: 40px; margin: 25px auto; border: 4px solid #eee; border-top: 4px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success-icon { text-align: center; font-size: 55px; color: #34a853; }
    .success-text { text-align: center; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
<div class="app">
  <div class="logo">ARISTO ATTENDANCE</div>

  <div id="login-view" class="view active">
    <div class="card">
      <label for="empId">Employee ID</label>
      <input id="empId" type="text" placeholder="Employee ID" autocomplete="username" autocapitalize="characters">
      <label for="pin">PIN</label>
      <input id="pin" type="password" placeholder="PIN" inputmode="numeric" autocomplete="current-password">
      <button id="login-btn" class="blue" onclick="handleLogin()">LOGIN</button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <div id="dashboard-view" class="view">
    <div class="card">
      <h2 id="welcome-text" style="text-align:center;">Welcome</h2>
      <div id="status-display" class="status">Checking status...</div>
      <div id="last-action-time" class="subtext"></div>
      <button id="action-btn" onclick="startProcess()" style="display:none;">PROCEED</button>
    </div>
  </div>

  <div id="process-view" class="view">
    <div class="card">
      <h3 id="process-title" style="text-align:center;">Take Photo</h3>
      <input id="camera-input" type="file" accept="image/*" capture="user" style="display:none;" onchange="handleFileSelect(event)">
      <div id="camera-container">
        <button class="green" onclick="openCamera()">📷 TAKE PHOTO</button>
      </div>
      <div id="preview-container" style="display:none;">
        <img id="photo-preview" alt="Photo Preview">
        <div class="photo-buttons">
          <button class="red" onclick="retakePhoto()">RETAKE</button>
          <button class="green" onclick="confirmPhoto()">USE PHOTO</button>
        </div>
      </div>
      <div id="loading-container" style="display:none;">
        <div class="loader"></div>
        <p id="loading-text" class="subtext">Processing...</p>
      </div>
      <div id="process-error" class="error"></div>
    </div>
  </div>

  <div id="success-view" class="view">
    <div class="card">
      <div class="success-icon">✓</div>
      <div id="success-title" class="success-text">SUCCESS</div>
      <p id="success-desc" class="subtext"></p>
      <button class="blue" onclick="resetApp()">HOME</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwf1Qbr2sPiPI7ETHB6cMXKSqyQ06eCvqabiMwHUs1FCROPhPYPD737sy931iXyODC/exec";

let currentUser = null;
let currentAction = null;
let capturedPhotoData = null;

function showView(id) {
  document.querySelectorAll(".view").forEach(function(view) {
    view.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

async function handleLogin() {
  const empId = document.getElementById("empId").value.trim().toUpperCase();
  const pin = document.getElementById("pin").value.trim();
  const error = document.getElementById("login-error");
  const button = document.getElementById("login-btn");

  if (!empId || !pin) {
    error.innerText = "Please enter Employee ID and PIN.";
    return;
  }

  if (!API_URL) {
    error.innerText = "Backend connection is not configured yet.";
    return;
  }

  button.disabled = true;
  error.innerText = "Authenticating...";

  try {
    const response = await apiCall("authenticateEmployee", { empId: empId, pin: pin });

    if (response.success) {
      currentUser = response;
      error.innerText = "";
      checkStatus();
    } else {
      error.innerText = response.message;
    }
  } catch (err) {
    console.error(err);
    error.innerText = "Unable to connect to the server.";
  }

  button.disabled = false;
}

async function checkStatus() {
  showView("dashboard-view");
  document.getElementById("welcome-text").innerText = "Welcome, " + currentUser.name;
  document.getElementById("status-display").innerText = "Checking today's status...";
  document.getElementById("action-btn").style.display = "none";

  try {
    const response = await apiCall("getAttendanceStatus", { empId: currentUser.empId });
    currentAction = response.nextAction;

    const status = document.getElementById("status-display");
    const button = document.getElementById("action-btn");
    const lastTime = document.getElementById("last-action-time");

    if (currentAction === "DONE") {
      status.innerText = "You have completed the maximum 2 sessions for today.";
      lastTime.innerText = "";
      button.style.display = "none";
      return;
    }

    status.innerText = "Next Action: " + currentAction;

    if (response.loginTime) {
      lastTime.innerText = "Last Login: " + response.loginTime;
    } else {
      lastTime.innerText = "";
    }

    button.innerText = currentAction.includes("LOGIN") ? "RECORD LOGIN" : "RECORD LOGOUT";
    button.className = currentAction.includes("LOGIN") ? "green" : "red";
    button.style.display = "block";
  } catch (err) {
    console.error(err);
    document.getElementById("status-display").innerText = "Unable to load attendance status.";
  }
}

function startProcess() {
  showView("process-view");
  document.getElementById("process-title").innerText = "Take " + currentAction + " Photo";
  resetPhotoState();
  setTimeout(function() { openCamera(); }, 150);
}

function openCamera() {
  const input = document.getElementById("camera-input");
  input.value = "";
  document.getElementById("process-error").innerText = "";
  input.click();
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const error = document.getElementById("process-error");
  error.innerText = "Preparing photo...";

  const reader = new FileReader();

  reader.onload = function(e) {
    const img = new Image();

    img.onload = function() {
      const MAX_SIZE = 1280;
      let width = img.width;
      let height = img.height;

      if (width > MAX_SIZE || height > MAX_SIZE) {
        if (width > height) {
          height = Math.round(height * MAX_SIZE / width);
          width = MAX_SIZE;
        } else {
          width = Math.round(width * MAX_SIZE / height);
          height = MAX_SIZE;
        }
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      capturedPhotoData = canvas.toDataURL("image/jpeg", 0.75);

      document.getElementById("photo-preview").src = capturedPhotoData;
      document.getElementById("camera-container").style.display = "none";
      document.getElementById("preview-container").style.display = "block";
      error.innerText = "";
    };

    img.onerror = function() {
      error.innerText = "Unable to process the photo.";
    };

    img.src = e.target.result;
  };

  reader.onerror = function() {
    error.innerText = "Unable to read the photo.";
  };

  reader.readAsDataURL(file);
}

function retakePhoto() {
  capturedPhotoData = null;
  document.getElementById("preview-container").style.display = "none";
  document.getElementById("camera-container").style.display = "block";
  openCamera();
}

function confirmPhoto() {
  if (!capturedPhotoData) {
    document.getElementById("process-error").innerText = "Please take a photo first.";
    return;
  }

  document.getElementById("preview-container").style.display = "none";
  document.getElementById("loading-container").style.display = "block";
  document.getElementById("loading-text").innerText = "Getting your location...";

  if (!navigator.geolocation) {
    handleLocationError();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    processAttendance,
    handleLocationError,
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

async function processAttendance(position) {
  document.getElementById("loading-text").innerText = "Saving attendance...";

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  try {
    const response = await apiCall("recordAttendance", {
      empId: currentUser.empId,
      name: currentUser.name,
      action: currentAction,
      base64Photo: capturedPhotoData,
      lat: lat,
      lng: lng
    });

    if (response.success) {
      showView("success-view");
      document.getElementById("success-title").innerText = response.message;
      document.getElementById("success-desc").innerText = "Time: " + response.time;
      capturedPhotoData = null;
    } else {
      handleProcessError(response.message);
    }
  } catch (err) {
    console.error(err);
    handleProcessError("Unable to save attendance.");
  }
}

function handleLocationError(error) {
  let message = "Unable to obtain your location. Please enable location services and try again.";

  if (error && error.code === 1) {
    message = "Location permission is required.";
  }

  if (error && error.code === 2) {
    message = "Your location is currently unavailable.";
  }

  if (error && error.code === 3) {
    message = "Location request timed out. Please try again.";
  }

  handleProcessError(message);
}

function handleProcessError(message) {
  document.getElementById("loading-container").style.display = "none";
  document.getElementById("preview-container").style.display = "block";
  document.getElementById("process-error").innerText = message;
}

function resetPhotoState() {
  capturedPhotoData = null;
  document.getElementById("camera-input").value = "";
  document.getElementById("photo-preview").src = "";
  document.getElementById("preview-container").style.display = "none";
  document.getElementById("camera-container").style.display = "block";
  document.getElementById("loading-container").style.display = "none";
  document.getElementById("process-error").innerText = "";
}

async function apiCall(action, data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      action: action,
      data: data
    })
  });

  if (!response.ok) {
    throw new Error("HTTP " + response.status);
  }

  return await response.json();
}

function resetApp() {
  document.getElementById("empId").value = "";
  document.getElementById("pin").value = "";
  currentUser = null;
  currentAction = null;
  capturedPhotoData = null;
  resetPhotoState();
  showView("login-view");
}
</script>
</body>
</html>
