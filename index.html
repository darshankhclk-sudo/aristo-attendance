<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#ffffff">

  <title>ARISTO ATTENDANCE</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Fast loading screen shown immediately by GitHub Pages */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity 0.25s ease;
    }

    #loading-screen h1 {
      margin: 0 0 12px;
      font-size: 30px;
      letter-spacing: 1px;
      color: #1769e0;
    }

    #loading-screen p {
      margin: 0;
      font-size: 15px;
      color: #666666;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin-top: 20px;
      border: 4px solid #eeeeee;
      border-top-color: #1769e0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <!-- Appears immediately while Google Apps Script loads -->
  <div id="loading-screen">
    <h1>ARISTO</h1>
    <p>Attendance</p>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbx-QkL3syZlXdj7c-W8LqLoEND9ZqJnESYAV8sFVhifJD7HioPuBCbzVuF9GZoEowkwFA/exec"
    allow="camera; geolocation"
    title="ARISTO Attendance">
  </iframe>

  <script>
    const frame = document.getElementById('app-frame');
    const loader = document.getElementById('loading-screen');

    frame.addEventListener('load', function () {
      /*
       * The iframe load event fires after the Apps Script page has loaded.
       * A very short delay gives the UI time to paint before removing
       * the loading screen.
       */
      setTimeout(function () {
        loader.style.opacity = '0';

        setTimeout(function () {
          loader.remove();
        }, 250);
      }, 300);
    });
  </script>

</body>
</html>
